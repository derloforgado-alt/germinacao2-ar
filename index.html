<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Germinação de Sementes — Realidade Aumentada</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f4f8ef;color:#173b22}
  .top{position:fixed;z-index:10;top:0;left:0;right:0;padding:10px 14px;background:rgba(255,255,255,.94);box-shadow:0 2px 10px #0002}
  .top b{font-size:18px}.top small{display:block;margin-top:3px}
  .help{position:fixed;z-index:11;left:12px;right:12px;bottom:14px;background:rgba(255,255,255,.95);
        border-radius:16px;padding:12px 14px;box-shadow:0 4px 20px #0003}
  .help strong{color:#28763a}
  .hidden{display:none}
  .pill{display:inline-block;margin-top:7px;padding:7px 10px;border-radius:999px;background:#e2f2df;font-size:13px}
</style>
</head>
<body style="margin:0;overflow:hidden">
<div class="top">
  <b>🌱 Germinação de Sementes</b>
  <small>Aponte a câmera para o marcador Hiro impresso.</small>
  <span class="pill" id="status">Procurando o marcador…</span>
</div>

<div class="help">
  <strong>Como usar</strong><br>
  1. Permita o acesso à câmera.<br>
  2. Mostre o marcador impresso à câmera.<br>
  3. Quando aparecer a planta, mova o celular para observar.<br>
  <span id="found" class="hidden">✅ Marcador encontrado! Observe a raiz, o caule e as folhas.</span>
</div>

<a-scene embedded
  vr-mode-ui="enabled:false"
  renderer="colorManagement:true; logarithmicDepthBuffer:true"
  arjs="sourceType: webcam; debugUIEnabled:false; detectionMode: mono; matrixCodeType: 3x3;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">
    <!-- Modelo 3D local: manter na mesma pasta deste arquivo -->
    <a-entity
      id="plant"
      gltf-model="./germinacao_sementes_AR.glb"
      position="0 0 0"
      rotation="-90 0 0"
      scale="0.35 0.35 0.35">
    </a-entity>

    <a-text value="GERMINAÇÃO"
      position="0 1.25 0"
      rotation="-90 0 0"
      align="center"
      color="#1f6b32"
      width="2.2">
    </a-text>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const marker = document.querySelector('#hiroMarker');
const status = document.querySelector('#status');
const found = document.querySelector('#found');

marker.addEventListener('markerFound', () => {
  status.textContent = 'Marcador encontrado ✓';
  status.style.background = '#d7f2d8';
  found.classList.remove('hidden');
});
marker.addEventListener('markerLost', () => {
  status.textContent = 'Procurando o marcador…';
  status.style.background = '#e2f2df';
  found.classList.add('hidden');
});
</script>
</body>
</html>
